<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png">
  <title>Attendance Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-red-800 border-b-4 border-yellow-500 py-4 px-6 flex justify-between items-center">
    <h1 class="text-white text-2xl font-bold">Attendance Report</h1>
    <a href="admin.html" class="text-yellow-300 text-sm underline">← Back to Admin</a>
  </header>

  <main class="max-w-4xl mx-auto p-6">

    <div id="loading" class="text-center text-gray-500">Loading report...</div>

    <div id="report-content" class="hidden">
      <!-- Event summary -->
      <div class="bg-white rounded-xl shadow p-6 border border-gray-200 mb-6">
        <div class="flex justify-between items-start">
          <div>
            <h2 id="event-name" class="text-lg font-semibold text-red-800 mb-1"></h2>
            <p id="event-meta" class="text-sm text-gray-500 mb-4"></p>
          </div>
          <span id="live-badge" class="text-xs font-semibold px-2 py-1 rounded-full bg-gray-200 text-gray-500">
            ○ Connecting...
          </span>
        </div>
        <div id="stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>

      <!-- Filters + export -->
      <div class="bg-white rounded-xl shadow p-4 border border-gray-200 mb-4 flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[150px]">
          <label class="block text-xs font-medium text-gray-600 mb-1">Search name</label>
          <input type="text" id="search-input" placeholder="Type a name..."
            class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Status</label>
          <select id="status-filter" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm">
            <option value="">All</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Department</label>
          <select id="dept-filter" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm">
            <option value="">All</option>
          </select>
        </div>
        <button onclick="exportCSV()"
          class="bg-yellow-500 hover:bg-yellow-600 text-red-900 font-semibold text-sm px-4 py-1.5 rounded-lg">
          Export CSV
        </button>
      </div>

      <!-- Records table -->
      <div class="bg-white rounded-xl shadow border border-gray-200 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-100 text-gray-600 text-left">
            <tr>
              <th class="px-3 py-2">Name</th>
              <th class="px-3 py-2">Department</th>
              <th class="px-3 py-2">Program</th>
              <th class="px-3 py-2">Year/Section</th>
              <th class="px-3 py-2">Status</th>
              <th class="px-3 py-2">Check-In</th>
              <th class="px-3 py-2">Check-Out</th>
              <th class="px-3 py-2">Response</th>
              <th class="px-3 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="security.js"></script>
  <script src="auth.js"></script>
  <script>

    requireAuth(async () => {
      await init();
    });
    
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");

    let currentEvent = null;
    let allRecords = [];

    async function init() {
      if (!eventId) {
        document.getElementById("loading").textContent = "No event specified.";
        return;
      }

      const { data: eventData, error: eventError } = await supabaseClient
        .from("events").select("*").eq("id", eventId).single();

      if (eventError || !eventData) {
        document.getElementById("loading").textContent = "Event not found.";
        return;
      }
      currentEvent = eventData;

      const { data: records, error: recordsError } = await supabaseClient
        .from("attendance_records").select("*").eq("event_id", eventId)
        .order("last_name");

      if (recordsError) {
        document.getElementById("loading").textContent = "Error loading records: " + recordsError.message;
        return;
      }
      allRecords = records;

      document.getElementById("event-name").textContent = currentEvent.name;
      document.getElementById("event-meta").textContent =
        `${currentEvent.event_date} · ${currentEvent.event_type === 'open' ? 'Open Event' : 'Closed Event'}`;

      renderStats();
      populateDeptFilter();
      renderTable(allRecords);

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("report-content").classList.remove("hidden");

      document.getElementById("search-input").addEventListener("input", applyFilters);
      document.getElementById("status-filter").addEventListener("change", applyFilters);
      document.getElementById("dept-filter").addEventListener("change", applyFilters);

      subscribeToLiveUpdates();
    }

    // Subscribes to any insert/update/delete on attendance_records for THIS
    // event only, and re-fetches automatically whenever one happens.
    function subscribeToLiveUpdates() {
      const badge = document.getElementById("live-badge");

      supabaseClient
        .channel(`attendance-${eventId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "attendance_records",
            filter: `event_id=eq.${eventId}`
          },
          (payload) => {
            refreshRecords();
            // Brief visual pulse so it's obvious something just happened
            badge.textContent = "🟢 Live update!";
            setTimeout(() => { badge.textContent = "🟢 Live"; }, 1500);
          }
        )
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            badge.textContent = "🟢 Live";
            badge.className = "text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700";
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            badge.textContent = "⚠️ Live updates unavailable";
            badge.className = "text-xs font-semibold px-2 py-1 rounded-full bg-yellow-100 text-yellow-700";
          }
        });
    }

    function renderStats() {
      const statsEl = document.getElementById("stats");
      const total = allRecords.length;

      if (currentEvent.event_type === "closed") {
        const present = allRecords.filter(r => r.status === "Present").length;
        statsEl.innerHTML = statCard("Total Roster", total) +
          statCard("Present", present, "text-green-700") +
          statCard("Absent", total - present, "text-gray-500");
      } else {
        const checkedIn = allRecords.filter(r => r.check_in_time).length;
        const checkedOut = allRecords.filter(r => r.check_out_time).length;
        const both = allRecords.filter(r => r.check_in_time && r.check_out_time).length;
        statsEl.innerHTML = statCard("Total Records", total) +
          statCard("Checked In", checkedIn, "text-green-700") +
          statCard("Checked Out", checkedOut, "text-green-700") +
          statCard("Full Attendance", both, "text-yellow-700");
      }
    }

    function statCard(label, value, colorClass = "text-gray-800") {
      return `
        <div class="bg-gray-50 rounded-lg p-3 text-center border border-gray-100">
          <p class="text-xl font-bold ${colorClass}">${value}</p>
          <p class="text-xs text-gray-500">${label}</p>
        </div>
      `;
    }

    function populateDeptFilter() {
      const deptSelect = document.getElementById("dept-filter");
      const depts = [...new Set(allRecords.map(r => r.department).filter(Boolean))].sort();
      depts.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        deptSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const status = document.getElementById("status-filter").value;
      const dept = document.getElementById("dept-filter").value;

      const filtered = allRecords.filter(r => {
        const fullName = `${r.first_name} ${r.middle_name || ''} ${r.last_name}`.toLowerCase();
        const matchesSearch = !search || fullName.includes(search);
        const matchesStatus = !status || r.status === status;
        const matchesDept = !dept || r.department === dept;
        return matchesSearch && matchesStatus && matchesDept;
      });

      renderTable(filtered);
    }

    function renderTable(records) {
      const tbody = document.getElementById("records-body");
      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-gray-400 py-6">No matching records.</td></tr>`;
        return;
      }

      tbody.innerHTML = records.map(r => `
        <tr class="border-t border-gray-100" id="row-${r.id}">
          <td class="px-3 py-2" id="cell-name-${r.id}">${escapeHtml(r.last_name)}, ${escapeHtml(r.first_name)} ${escapeHtml(r.middle_name || '')}</td>
          <td class="px-3 py-2" id="cell-dept-${r.id}">${r.department || '—'}</td>
          <td class="px-3 py-2" id="cell-program-${r.id}">${r.program || '—'}</td>
          <td class="px-3 py-2" id="cell-yearsec-${r.id}">${[r.year_level, r.section].filter(Boolean).join(' / ') || '—'}</td>
          <td class="px-3 py-2 ${r.status === 'Present' ? 'text-green-700' : 'text-gray-400'}" id="cell-status-${r.id}">${r.status}</td>
          <td class="px-3 py-2">${formatTime(r.check_in_time)}</td>
          <td class="px-3 py-2">${formatTime(r.check_out_time)}</td>
          <td class="px-3 py-2 max-w-[150px]">
            ${r.custom_response ? `
              <details>
                <summary class="text-red-800 underline cursor-pointer text-xs">View</summary>
                <p class="text-xs text-gray-700 mt-1 whitespace-pre-wrap">${escapeHtml(r.custom_response)}</p>
              </details>
            ` : '—'}
          </td>
          <td class="px-3 py-2 whitespace-nowrap" id="cell-actions-${r.id}">
            ${window.currentAdminRole === 'coordinator' ? `
              <button onclick="startEditRow('${r.id}')" class="text-red-800 underline text-xs">Edit</button>
              <button onclick="deleteRecord('${r.id}')" class="text-red-600 underline text-xs ml-2">Delete</button>
            ` : `<span class="text-gray-300 text-xs">View only</span>`}
          </td>
        </tr>
      `).join("");
    }

    // Swaps one row's display cells for editable inputs
    function startEditRow(recordId) {
      const record = allRecords.find(r => r.id === recordId);
      if (!record) return;

      document.getElementById(`cell-name-${recordId}`).innerHTML = `
        <input id="edit-first-${recordId}" value="${record.first_name || ''}" class="border rounded px-1 py-0.5 w-16 text-xs" placeholder="First" />
        <input id="edit-middle-${recordId}" value="${record.middle_name || ''}" class="border rounded px-1 py-0.5 w-14 text-xs" placeholder="Middle" />
        <input id="edit-last-${recordId}" value="${record.last_name || ''}" class="border rounded px-1 py-0.5 w-16 text-xs" placeholder="Last" />
      `;
      document.getElementById(`cell-dept-${recordId}`).innerHTML =
        `<input id="edit-dept-${recordId}" value="${record.department || ''}" class="border rounded px-1 py-0.5 w-20 text-xs" />`;
      document.getElementById(`cell-program-${recordId}`).innerHTML =
        `<input id="edit-program-${recordId}" value="${record.program || ''}" class="border rounded px-1 py-0.5 w-20 text-xs" />`;
      document.getElementById(`cell-yearsec-${recordId}`).innerHTML = `
        <input id="edit-year-${recordId}" value="${record.year_level || ''}" class="border rounded px-1 py-0.5 w-14 text-xs" placeholder="Year" />
        <input id="edit-section-${recordId}" value="${record.section || ''}" class="border rounded px-1 py-0.5 w-12 text-xs" placeholder="Sec" />
      `;
      document.getElementById(`cell-status-${recordId}`).innerHTML = `
        <select id="edit-status-${recordId}" class="border rounded px-1 py-0.5 text-xs">
          <option value="Present" ${record.status === 'Present' ? 'selected' : ''}>Present</option>
          <option value="Absent" ${record.status === 'Absent' ? 'selected' : ''}>Absent</option>
        </select>
      `;
      document.getElementById(`cell-actions-${recordId}`).innerHTML = `
        <button onclick="saveEditRow('${recordId}')" class="text-green-700 underline text-xs">Save</button>
        <button onclick="renderTable(allRecords)" class="text-gray-500 underline text-xs ml-2">Cancel</button>
      `;
    }

    async function saveEditRow(recordId) {
      const updated = {
        first_name: document.getElementById(`edit-first-${recordId}`).value.trim(),
        middle_name: document.getElementById(`edit-middle-${recordId}`).value.trim(),
        last_name: document.getElementById(`edit-last-${recordId}`).value.trim(),
        department: document.getElementById(`edit-dept-${recordId}`).value.trim(),
        program: document.getElementById(`edit-program-${recordId}`).value.trim(),
        year_level: document.getElementById(`edit-year-${recordId}`).value.trim(),
        section: document.getElementById(`edit-section-${recordId}`).value.trim(),
        status: document.getElementById(`edit-status-${recordId}`).value
      };

      const { error } = await supabaseClient
        .from("attendance_records")
        .update(updated)
        .eq("id", recordId);

      if (error) {
        showToast("Error saving change: " + error.message, "error");
        return;
      }

      await refreshRecords();
    }

    async function deleteRecord(recordId) {
      const confirmed = await showConfirmDialog("Archive this attendance record? It will be hidden from this report but remains recoverable.");
      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("attendance_records")
        .update({ deleted_at: new Date().toISOString() })
        .eq("id", recordId);

      if (error) {
        showToast("Error archiving: " + error.message, "error");
        return;
      }
      showToast("Record archived.");
      await refreshRecords();
    }

    // Re-fetches records from Supabase and re-renders everything that depends on them
    async function refreshRecords() {
      const { data, error } = await supabaseClient
        .from("attendance_records").select("*").eq("event_id", eventId)
        .is("deleted_at", null)
        .order("last_name");

      if (error) return;
      allRecords = data;
      renderStats();
      applyFilters(); // re-runs the table render through whatever search/status/dept filters are active
    }

    function formatTime(isoString) {
      if (!isoString) return '—';
      return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ---- CSV Export ----
    function exportCSV() {
      const search = document.getElementById("search-input").value.toLowerCase().trim();
      const status = document.getElementById("status-filter").value;
      const dept = document.getElementById("dept-filter").value;

      const filtered = allRecords.filter(r => {
        const fullName = `${r.first_name} ${r.middle_name || ''} ${r.last_name}`.toLowerCase();
        const matchesSearch = !search || fullName.includes(search);
        const matchesStatus = !status || r.status === status;
        const matchesDept = !dept || r.department === dept;
        return matchesSearch && matchesStatus && matchesDept;
      });

      const headers = ["Last Name", "First Name", "Middle Name", "Department", "Program", "Year Level", "Section", "Status", "Check-In", "Check-Out", "Response"];
      const rows = filtered.map(r => [
        r.last_name, r.first_name, r.middle_name || '', r.department || '', r.program || '',
        r.year_level || '', r.section || '', r.status,
        r.check_in_time ? new Date(r.check_in_time).toLocaleString() : '',
        r.check_out_time ? new Date(r.check_out_time).toLocaleString() : '',
        r.custom_response || ''
      ]);

      // Wrap each value in quotes and escape any internal quotes, so commas/names with quotes don't break the CSV
      const csvContent = [headers, ...rows]
        .map(row => row.map(val => `"${String(val).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${currentEvent.name.replace(/\s+/g, '-')}-attendance.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      const isSuccess = type === "success";
      toast.className = `flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white transition-all duration-300 opacity-0 translate-y-2 ${isSuccess ? 'bg-green-600' : 'bg-red-700'}`;
      toast.innerHTML = `<span>${isSuccess ? '✅' : '⚠️'}</span><span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => toast.classList.remove("opacity-0", "translate-y-2"));

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Promise-based replacement for window.confirm(). Because a real modal
    // can't return a value synchronously the way confirm() does, callers now
    // need "await" -- see the updated deleteEvent()/deleteRosterEntry() below.
    function showConfirmDialog(message) {
      return new Promise((resolve) => {
        const previouslyFocused = document.activeElement;
        const overlay = document.createElement("div");
        overlay.id = "confirm-dialog-overlay";
        overlay.className = "fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[130] p-4";
        overlay.setAttribute("role", "alertdialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-labelledby", "confirm-dialog-message");
        overlay.innerHTML = `
          <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5">
            <p id="confirm-dialog-message" class="text-sm text-gray-700 mb-4 whitespace-pre-line">${message}</p>
            <div class="flex justify-end gap-2">
              <button id="confirm-cancel" class="text-xs font-medium px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50">Cancel</button>
              <button id="confirm-ok" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-800 hover:bg-red-900 text-white">Confirm</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        const close = (result) => {
          overlay.remove();
          document.removeEventListener("keydown", onKeydown);
          if (previouslyFocused) previouslyFocused.focus();
          resolve(result);
        };
        const onKeydown = (e) => { if (e.key === "Escape") close(false); };

        document.addEventListener("keydown", onKeydown);
        overlay.querySelector("#confirm-cancel").onclick = () => close(false);
        overlay.querySelector("#confirm-ok").onclick = () => close(true);
        overlay.querySelector("#confirm-cancel").focus();
      });
    }
    
    
  </script>

  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>
</html>
