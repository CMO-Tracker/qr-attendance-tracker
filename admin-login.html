<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-red-900 min-h-screen flex items-center justify-center px-4">

  <div class="bg-white rounded-xl shadow-lg p-8 max-w-sm w-full border-4 border-yellow-500">
    <h1 class="text-2xl font-bold text-red-800 mb-6 text-center">Admin Login</h1>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="login-email" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="login-password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>
      <button type="submit"
        class="w-full bg-red-800 hover:bg-red-900 text-white font-semibold py-2 rounded-lg">
        Log In
      </button>
      <p id="login-message" class="text-sm text-center"></p>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const messageEl = document.getElementById("login-message");

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        messageEl.textContent = "❌ " + error.message;
        messageEl.className = "text-sm text-center text-red-600";
      } else {
        window.location.href = "admin.html";
      }
    });
  </script>
</body>
</html>
