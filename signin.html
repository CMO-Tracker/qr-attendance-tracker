<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png">
  <title>Sign In — QR Attendance Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7f1d1d">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen py-8 px-4" style="background: linear-gradient(to bottom, #450a0a, #7f1d1d, #451a03);">

  <div id="network-bar" class="fixed top-0 left-0 right-0 z-50 text-center text-sm font-semibold py-2 bg-green-600 text-white">
    Connected to School Database
  </div>

  <div id="sync-badge" class="fixed bottom-4 right-4 z-50 flex items-center gap-2 bg-white shadow-lg border border-gray-200 rounded-full px-3 py-1.5 text-xs font-semibold">
    <span id="sync-badge-dot" class="w-2 h-2 rounded-full bg-green-500"></span>
    <span id="sync-badge-text" class="text-gray-700">Synced</span>
  </div>

  <div class="max-w-md mx-auto mt-10">

  <div class="max-w-md mx-auto">

    <div id="loading-state" class="bg-white rounded-xl shadow-lg p-6 text-center border-4 border-yellow-500">
      <p class="text-gray-600">Loading event...</p>
    </div>

    <div id="error-state" class="hidden bg-white rounded-xl shadow-lg p-6 text-center border-4 border-yellow-500">
      <p class="text-red-700 font-semibold" id="error-message"></p>
    </div>

    <div id="locked-state" class="hidden bg-white rounded-xl shadow-lg p-6 text-center border-4 border-yellow-500">
      <p class="text-3xl mb-2">🔒</p>
      <p class="text-yellow-800 font-semibold" id="locked-message"></p>
    </div>

    <!-- OPEN EVENT FORM -->
    <div id="signin-form-wrapper" class="hidden bg-white rounded-2xl shadow-2xl p-6 pt-5 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600"></div>

      <div class="flex justify-center mb-4">
        <img src="logo.png" alt="School Logo" class="h-16 w-16 object-contain" />
      </div>
      <h1 id="event-title" class="text-xl font-bold text-gray-900 text-center mb-1"></h1>
      <p id="action-label" class="text-sm font-semibold text-red-800 uppercase text-center tracking-wide mb-5"></p>

      <form id="signin-form" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
            <input type="text" id="first-name" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input type="text" id="last-name" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name / Initial</label>
          <input type="text" id="middle-name" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">College / Department</label>
            <select id="department" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all">
              <option value="">-- Select --</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Course / Program</label>
            <select id="program" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all">
              <option value="">-- Select Dept First --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div id="year-level-wrapper">
            <label class="block text-sm font-medium text-gray-700 mb-1">Year Level</label>
            <select id="year-level" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all">
              <option value="">-- Select --</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Section</label>
            <input type="text" id="section" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all" />
          </div>
        </div>

        <div id="custom-question-wrapper" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1" id="custom-question-label"></label>
          <textarea id="custom-question-input" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-800 focus:border-red-800 transition-all"></textarea>
        </div>

        <button type="submit" class="w-full bg-red-800 hover:bg-red-900 text-white font-semibold py-2.5 rounded-lg mt-2 transition-colors">
          Submit
        </button>
      </form>
    </div>

    <!-- ONE-TOUCH CHECK-OUT -->
    <div id="one-touch-wrapper" class="hidden bg-white rounded-2xl shadow-2xl p-6 pt-5 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600"></div>
      <div class="flex justify-center mb-4">
        <img src="logo.png" alt="School Logo" class="h-16 w-16 object-contain" />
      </div>
      <h1 id="one-touch-title" class="text-xl font-bold text-red-800 mb-1"></h1>
      <p class="text-sm font-semibold text-yellow-700 uppercase mb-4">Check-Out</p>

      <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-4 text-center">
        <p class="text-lg font-semibold text-gray-800" id="one-touch-name"></p>
        <p class="text-sm text-gray-500 mt-1" id="one-touch-details"></p>
      </div>

      <div id="one-touch-question-wrapper" class="hidden text-left mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1" id="one-touch-question-label"></label>
        <textarea id="one-touch-question-input" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
      </div>

      <button id="one-touch-confirm-btn"
        class="w-full bg-red-800 hover:bg-red-900 text-white font-semibold py-2 rounded-lg">
        Confirm Check-Out
      </button>
      <button type="button" onclick="showManualCheckoutForm()"
        class="w-full text-xs text-gray-500 underline mt-3">
        Not you? Fill out manually
      </button>
    </div>


    <!-- CLOSED EVENT FORM -->
    <div id="closed-form-wrapper" class="hidden bg-white rounded-2xl shadow-2xl p-6 pt-5 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600"></div>
      <div class="flex justify-center mb-4">
        <img src="logo.png" alt="School Logo" class="h-16 w-16 object-contain" />
      </div>
      <h1 id="closed-event-title" class="text-xl font-bold text-red-800 mb-1"></h1>
      <p class="text-sm font-semibold text-yellow-700 uppercase mb-4">Verify Your Name</p>

      <form id="closed-signin-form" class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input type="text" id="closed-name-input" required
            placeholder="e.g. Dela Cruz, Juan Miguel"
            class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <button type="submit" class="w-full bg-red-800 hover:bg-red-900 text-white font-semibold py-2 rounded-lg">
          Find My Name
        </button>
      </form>
      <div id="match-results" class="mt-2 space-y-1"></div>
    </div>

    <!-- Shared status message + success area for BOTH flows -->
   <div id="form-message" class="text-sm text-center mt-3 text-white"></div>
    <div id="success-area" class="max-w-md mx-auto"></div>

  <p class="text-center mt-4">
      <button onclick="openReceiptsModal()" class="text-yellow-300 text-xs underline">View Attendance Receipts</button>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="departments.js"></script>
  <script src="nameParser.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("event");
    const action = params.get("action");

    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const errorMessage = document.getElementById("error-message");
    const formWrapper = document.getElementById("signin-form-wrapper");
    const closedFormWrapper = document.getElementById("closed-form-wrapper");
    const messageEl = document.getElementById("form-message");

    let currentEvent = null;
    let currentMatches = [];

    async function init() {
      if (!eventId || !action) {
        showError("This QR code is missing information. Please rescan the official event QR code.");
        return;
      }

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .eq("id", eventId)
        .is("deleted_at", null)
        .single();

      if (error || !data) {
        showError("This event could not be found. It may have been removed.");
        return;
      }

      currentEvent = data;

      const scheduleCheck = isWithinScheduleWindow();
      if (!scheduleCheck.ok) {
        showLocked(scheduleCheck.reason);
        return;
      }

      loadingState.classList.add("hidden");

      if (currentEvent.event_type === "closed") {
        document.getElementById("closed-event-title").textContent = currentEvent.name;
        closedFormWrapper.classList.remove("hidden");
      } else if (action === "checkout" && getSessionForEvent(eventId)) {
        cachedSession = getSessionForEvent(eventId);
        document.getElementById("one-touch-title").textContent = currentEvent.name;
        document.getElementById("one-touch-name").textContent =
          `${cachedSession.first_name} ${cachedSession.middle_name || ''} ${cachedSession.last_name}`.replace(/\s+/g, ' ').trim();
        document.getElementById("one-touch-details").textContent =
          [cachedSession.department, cachedSession.program, cachedSession.year_level, cachedSession.section].filter(Boolean).join(' · ');

        if (currentEvent.custom_question) {
          document.getElementById("one-touch-question-label").textContent = currentEvent.custom_question;
          document.getElementById("one-touch-question-wrapper").classList.remove("hidden");
          document.getElementById("one-touch-question-input").required = true;
        }

        oneTouchWrapper.classList.remove("hidden");
      } else {
        document.getElementById("event-title").textContent = currentEvent.name;
        document.getElementById("action-label").textContent = action === "checkin" ? "Check-In" : "Check-Out";
        populateDepartments();

        if (currentEvent.custom_question) {
          document.getElementById("custom-question-label").textContent = currentEvent.custom_question;
          document.getElementById("custom-question-wrapper").classList.remove("hidden");
          document.getElementById("custom-question-input").required = true;
        }

        formWrapper.classList.remove("hidden");
      }
    }

    function showError(msg) {
      loadingState.classList.add("hidden");
      errorMessage.textContent = msg;
      errorState.classList.remove("hidden");
    }

    // ---- Device fingerprint (shared by both flows) ----
    function getDeviceFingerprint() {
      const STORAGE_KEY = "qr_attendance_device_id";
      let deviceId = localStorage.getItem(STORAGE_KEY);

      if (!deviceId) {
        const match = document.cookie.match(new RegExp('(^| )' + STORAGE_KEY + '=([^;]+)'));
        if (match) deviceId = match[2];
      }
      if (!deviceId) {
        deviceId = crypto.randomUUID();
      }

      localStorage.setItem(STORAGE_KEY, deviceId);
      const oneYearInSeconds = 60 * 60 * 24 * 365;
      document.cookie = `${STORAGE_KEY}=${deviceId}; max-age=${oneYearInSeconds}; path=/; SameSite=Lax`;
      return deviceId;

    }
  // Calculates the distance in meters between two GPS coordinates
    // using the Haversine formula (accounts for Earth's curvature).
    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth's radius in meters
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Wraps the browser's callback-based geolocation API in a Promise,
    // so we can simply "await" a location instead of nesting callbacks.
    function getCurrentPositionAsync(options) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    // Returns { ok: true } if the student is within range of the event venue,
    // or { ok: false, reason: "..." } if they're too far away or location
    // couldn't be determined.
    async function verifyGeofence() {
      // No coordinates set on this event -> skip the check entirely
      if (currentEvent.latitude == null || currentEvent.longitude == null) {
        return { ok: true };
      }

      if (!navigator.geolocation) {
        return { ok: false, reason: "Your browser does not support location services, which are required to register attendance for this event." };
      }

      try {
        const position = await getCurrentPositionAsync({ enableHighAccuracy: true, timeout: 10000 });
        const distance = calculateDistanceMeters(
          position.coords.latitude, position.coords.longitude,
          currentEvent.latitude, currentEvent.longitude
        );

        if (distance > currentEvent.radius_meters) {
          return { ok: false, reason: "You must be physically present at the venue to register." };
        }
        return { ok: true };
      } catch (err) {
        return { ok: false, reason: "We couldn't verify your location. Please enable location permissions for this site and try again." };
      }
    }

    // Returns { ok: true } if "now" falls within the event's start/end
    // window, or { ok: false, reason: "..." } if it's too early or too late.
    function isWithinScheduleWindow() {
      if (currentEvent.status_override === "force_open") {
        return { ok: true };
      }
      if (currentEvent.status_override === "force_closed") {
        return { ok: false, reason: "This event has been manually closed by the admin. Attendance is not currently being accepted." };
      }

      // Strict phase timings only apply to open-event Check-In/Check-Out —
      // never to closed-event 'signin', and only when the admin enabled it.
      if (currentEvent.use_strict_timings && (action === "checkin" || action === "checkout")) {
        const windowStart = action === "checkin" ? currentEvent.checkin_start : currentEvent.checkout_start;
        const windowEnd = action === "checkin" ? currentEvent.checkin_end : currentEvent.checkout_end;
        const label = action === "checkin" ? "Check-In" : "Check-Out";

        // Safety net: if the admin enabled the toggle but left a window blank,
        // don't block everyone — just skip this specific check.
        if (!windowStart || !windowEnd) return { ok: true };

        const now = new Date();
        const start = new Date(windowStart);
        const end = new Date(windowEnd);

        if (now < start) {
          return { ok: false, reason: `${label} hasn't opened yet. It opens at ${start.toLocaleString()}.` };
        }
        if (now > end) {
          return { ok: false, reason: `${label} window has closed. It closed at ${end.toLocaleString()}.` };
        }
        return { ok: true };
      }

      // Fallback: standard overall event start_time/end_time
      if (!currentEvent.start_time || !currentEvent.end_time) {
        return { ok: true };
      }
      const now = new Date();
      const start = new Date(currentEvent.start_time);
      const end = new Date(currentEvent.end_time);

      if (now < start) {
        return { ok: false, reason: `This event hasn't started yet. Attendance opens at ${start.toLocaleString()}.` };
      }
      if (now > end) {
        return { ok: false, reason: `This event's attendance window has closed. It ended at ${end.toLocaleString()}.` };
      }
      return { ok: true };
    }

    // Builds the checkout reminder text for a successful Check-In, based on
    // whichever timing mode the event uses.
    function getCheckinReminderMessage() {
      if (currentEvent.use_strict_timings && currentEvent.checkout_start && currentEvent.checkout_end) {
        const start = new Date(currentEvent.checkout_start).toLocaleString([], { hour: '2-digit', minute: '2-digit' });
        const end = new Date(currentEvent.checkout_end).toLocaleString([], { hour: '2-digit', minute: '2-digit' });
        return `Please remember to scan the Check-Out QR code between ${start} and ${end} to be marked present.`;
      } else if (currentEvent.end_time) {
        const end = new Date(currentEvent.end_time).toLocaleString([], { hour: '2-digit', minute: '2-digit' });
        return `Remember to check out before the event ends at ${end}.`;
      }
      return "";
    }

    function showLocked(msg) {
      loadingState.classList.add("hidden");
      document.getElementById("locked-message").textContent = msg;
      document.getElementById("locked-state").classList.remove("hidden");
    }

    // Renders the gold warning card required for geofence failures
    function showGeofenceWarning(reason) {
      messageEl.innerHTML = `
        <div class="bg-yellow-100 border-2 border-yellow-500 text-yellow-900 rounded-lg p-3 text-sm font-semibold">
          ⚠️ ${reason}
        </div>
      `;
    }

    // ---- Offline Queue ----
    const OFFLINE_QUEUE_KEY = "qr_attendance_offline_queue";

    function getOfflineQueue() {
      try {
        return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveOfflineQueue(queue) {
      localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(queue));
    }

    function queueOfflineSubmission(entry) {
      const queue = getOfflineQueue();
      queue.push(entry);
      saveOfflineQueue(queue);
      updateNetworkBar();
    }

    function updateNetworkBar() {
      const bar = document.getElementById("network-bar");
      const queue = getOfflineQueue();

      if (navigator.onLine) {
        if (queue.length > 0) {
          bar.textContent = `Syncing ${queue.length} saved record(s)...`;
          bar.className = "fixed top-0 left-0 right-0 z-50 text-center text-sm font-semibold py-2 bg-yellow-500 text-red-900";
        } else {
          bar.textContent = "Connected to School Database";
          bar.className = "fixed top-0 left-0 right-0 z-50 text-center text-sm font-semibold py-2 bg-green-600 text-white";
        }
      } else {
        bar.textContent = "Offline - Attendance Saved Locally. Keep this page open.";
        bar.className = "fixed top-0 left-0 right-0 z-50 text-center text-sm font-semibold py-2 bg-yellow-500 text-red-900";
      }
      updateSyncBadge();
    }

    function updateSyncBadge() {
      const queue = getOfflineQueue();
      const dot = document.getElementById("sync-badge-dot");
      const text = document.getElementById("sync-badge-text");

      if (queue.length === 0) {
        dot.className = "w-2 h-2 rounded-full bg-green-500";
        text.textContent = "● Synced";
        text.className = "text-green-700";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
        text.textContent = `● ${queue.length} log(s) pending upload. Please do not close this tab until this turns green.`;
        text.className = "text-amber-700";
      }
    }

    // ---- Attendance Receipts ----
    const RECEIPTS_KEY = "attendance_receipts";
    const MAX_RECEIPTS = 200; // keeps localStorage from growing unbounded over a school year

    function saveReceipt(eventName, scanType) {
      let receipts = [];
      try {
        receipts = JSON.parse(localStorage.getItem(RECEIPTS_KEY)) || [];
      } catch { receipts = []; }

      receipts.unshift({
        eventName,
        date: new Date().toLocaleDateString(),
        scanType,
        timestamp: new Date().toLocaleString(),
        status: "Saved Locally"
      });

      if (receipts.length > MAX_RECEIPTS) receipts = receipts.slice(0, MAX_RECEIPTS);
      localStorage.setItem(RECEIPTS_KEY, JSON.stringify(receipts));
    }

    function openReceiptsModal() {
      let receipts = [];
      try {
        receipts = JSON.parse(localStorage.getItem(RECEIPTS_KEY)) || [];
      } catch { receipts = []; }

      const rows = receipts.length === 0
        ? `<p class="text-gray-400 text-sm text-center py-6">No receipts yet on this device.</p>`
        : receipts.map(r => `
            <div class="border-b border-gray-100 py-2">
              <p class="text-sm font-semibold text-gray-800">${r.eventName}</p>
              <p class="text-xs text-gray-500">${r.scanType} · ${r.timestamp}</p>
              <p class="text-xs text-green-700 font-medium">${r.status}</p>
            </div>
          `).join("");

      const modal = document.createElement("div");
      modal.id = "receipts-modal";
      modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4";
      modal.innerHTML = `
        <div class="bg-white rounded-xl shadow-lg max-w-sm w-full max-h-[80vh] flex flex-col">
          <div class="flex justify-between items-center p-4 border-b border-gray-100">
            <h2 class="text-lg font-bold text-red-800">My Attendance Receipts</h2>
            <button onclick="document.getElementById('receipts-modal').remove()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
          </div>
          <div class="p-4 overflow-y-auto">${rows}</div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    // Attempts to push every queued record to Supabase. Uses the same
    // lock-then-insert pattern as a live submission, so duplicates are
    // still safely rejected by the database even if something was queued twice.
    async function syncOfflineQueue() {
      if (!navigator.onLine) return;
      const queue = getOfflineQueue();
      if (queue.length === 0) return;

      updateNetworkBar();
      const remaining = [];

      for (const entry of queue) {
        const { error: lockError } = await supabaseClient
          .from("device_locks")
          .insert({ event_id: entry.eventId, action: entry.action, device_fingerprint: entry.deviceId });

        if (lockError) {
          continue; // already synced earlier, or a genuine duplicate - safe to drop
        }

       let error;
        if (entry.action === "checkout") {
          const existing = await findExistingCheckinRecord(entry.eventId, entry.record.first_name, entry.record.last_name);
          if (existing) {
            const updateData = { check_out_time: entry.record.check_out_time, status: determineOpenEventStatus(true, true) };
            if (entry.record.custom_response !== undefined) updateData.custom_response = entry.record.custom_response;
            ({ error } = await supabaseClient
              .from("attendance_records")
              .update(updateData)
              .eq("id", existing.id));
          } else {
            ({ error } = await supabaseClient.from("attendance_records").insert(entry.record));
          }
        } else {
          ({ error } = await supabaseClient.from("attendance_records").insert(entry.record));
        }
        if (error) {
          console.error("Sync failed for queued record:", error.message);
          // Roll back the lock we just claimed, so the retry isn't blocked by it
          await supabaseClient
            .from("device_locks")
            .delete()
            .eq("event_id", entry.eventId)
            .eq("action", entry.action)
            .eq("device_fingerprint", entry.deviceId);
          remaining.push(entry); // keep it queued to retry later
        }
      }

      saveOfflineQueue(remaining);
      updateNetworkBar();
    }

    window.addEventListener("online", () => {
      updateNetworkBar();
      syncOfflineQueue();
    });
    window.addEventListener("offline", updateNetworkBar);

    function showOfflineSavedMessage(action, targetEl = formWrapper) {
      targetEl.innerHTML = `
        <div class="text-center py-6">
          <p class="text-2xl mb-2">📶</p>
          <p class="text-lg font-semibold text-yellow-700">Saved locally — no connection detected</p>
          <p class="text-sm text-gray-500 mt-1">Your ${action === "checkin" ? "Check-In" : "Check-Out"} will sync automatically once you're back online. Keep this page open if possible.</p>
          ${action === "checkin" ? `<p class="text-sm text-yellow-800 font-medium mt-3">${getCheckinReminderMessage()}</p>` : ''}
        </div>
      `;
    }
    // ---- One-Touch Check-Out session ----
    const oneTouchWrapper = document.getElementById("one-touch-wrapper");
    let cachedSession = null;

    function getSessionKey(evId) {
      return `qr_attendance_session_${evId}`;
    }

    function saveSessionForEvent(evId, record) {
      const sessionData = {
        first_name: record.first_name,
        middle_name: record.middle_name,
        last_name: record.last_name,
        department: record.department,
        program: record.program,
        year_level: record.year_level,
        section: record.section
      };
      localStorage.setItem(getSessionKey(evId), JSON.stringify(sessionData));
    }

    function getSessionForEvent(evId) {
      try {
        const raw = localStorage.getItem(getSessionKey(evId));
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    // Open events only get full "Present" credit once BOTH check-in and
    // check-out exist. Anything less is "Partial" — this fixes the bug
    // where checking in alone used to show as fully Present immediately.
    function determineOpenEventStatus(hasCheckIn, hasCheckOut) {
      return (hasCheckIn && hasCheckOut) ? "Present" : "Partial";
    }

    // Core validation rules for a reflection answer's TEXT.
    // Assumes the field is actually active — the wrapper function below
    // handles deciding whether validation should run at all.
    function validateReflectionText(text) {
      const trimmed = text.trim();

      if (trimmed.length < 25) {
        return { ok: false, reason: "Your reflection is a bit too short. Please write at least a full sentence!" };
      }

      // Blocks a single character repeated 5+ times in a row (e.g. "jjjjjjjjjj", "...........")
      if (/(.)\1{4,}/.test(trimmed)) {
        return { ok: false, reason: "That doesn't look like a genuine reflection — please avoid repeated characters." };
      }

      // Requires at least 5 different letters used, to block keyboard-smashing like "asdfasdfasdf"
      // Requires at least 5 different letters used, to block keyboard-smashing like "asdfasdfasdf"
      const uniqueLetters = new Set((trimmed.toLowerCase().match(/[a-z]/g) || []));
      if (uniqueLetters.size < 5) {
        return { ok: false, reason: "That doesn't look like a genuine reflection — please write a real response." };
      }

      // Requires multiple words — a real sentence has spaces; one long
      // unbroken blob of characters (even with varied letters) isn't a sentence
      const wordCount = trimmed.split(/\s+/).filter(Boolean).length;
      if (wordCount < 4) {
        return { ok: false, reason: "Your reflection is a bit too short. Please write at least a full sentence!" };
      }

      return { ok: true };
    }

    // Wrapper that decides WHETHER validation should even run.
    // Returns { ok: true } immediately (skipping all checks) if this event
    // has no custom question configured, or the field isn't present/visible
    // on the current form — so normal check-ins are never affected.
    function validateReflectionField(inputEl) {
      if (!currentEvent.custom_question) return { ok: true };
      if (!inputEl) return { ok: true };
      if (inputEl.offsetParent === null) return { ok: true }; // hidden (display:none via our .hidden class)

      return validateReflectionText(inputEl.value);
    }

    // Finds an existing attendance row for this student that already has a
    // check_in_time, so Check-Out can update it instead of creating a duplicate.
    async function findExistingCheckinRecord(evId, firstName, lastName) {
      const { data, error } = await supabaseClient
        .from("attendance_records")
        .select("*")
        .eq("event_id", evId)
        .not("check_in_time", "is", null);

      if (error || !data) return null;

      return data.find(row => namesMatch(
        { firstName, lastName },
        { firstName: row.first_name, lastName: row.last_name }
      )) || null;
    }

    function showManualCheckoutForm() {
      oneTouchWrapper.classList.add("hidden");
      populateDepartments();
      formWrapper.classList.remove("hidden");
    }

    // ---- Department -> Program dependent dropdown (open events) ----
    function populateDepartments() {
      const deptSelect = document.getElementById("department");
      Object.keys(DEPARTMENT_PROGRAMS).forEach(dept => {
        const opt = document.createElement("option");
        opt.value = dept;
        opt.textContent = dept;
        deptSelect.appendChild(opt);
      });

      deptSelect.addEventListener("change", () => {
        const programSelect = document.getElementById("program");
        const selectedDept = deptSelect.value;
        programSelect.innerHTML = `<option value="">-- Select Program --</option>`;

        if (selectedDept && DEPARTMENT_PROGRAMS[selectedDept]) {
          DEPARTMENT_PROGRAMS[selectedDept].forEach(program => {
            const opt = document.createElement("option");
            opt.value = program;
            opt.textContent = program;
            programSelect.appendChild(opt);
          });
        }

        const yearLevelWrapper = document.getElementById("year-level-wrapper");
        const yearLevelSelect = document.getElementById("year-level");
        if (selectedDept === "BED") {
          yearLevelWrapper.classList.add("hidden");
          yearLevelSelect.required = false;
          yearLevelSelect.value = "";
        } else {
          yearLevelWrapper.classList.remove("hidden");
          yearLevelSelect.required = true;
        }
      });
    }

    // ---- OPEN EVENT: form submission ----
    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.querySelector("#signin-form button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const geoCheck = await verifyGeofence();
      if (!geoCheck.ok) {
        showGeofenceWarning(geoCheck.reason);
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        return;
      }

      const scheduleCheck = isWithinScheduleWindow();
      if (!scheduleCheck.ok) {
        showGeofenceWarning(scheduleCheck.reason);
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        return;
      }

      const reflectionCheck = validateReflectionField(document.getElementById("custom-question-input"));
      if (!reflectionCheck.ok) {
        alert(reflectionCheck.reason);
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        return;
      }

      const deviceId = getDeviceFingerprint();
      const record = {
        event_id: eventId,
        first_name: document.getElementById("first-name").value.trim(),
        middle_name: document.getElementById("middle-name").value.trim(),
        last_name: document.getElementById("last-name").value.trim(),
        department: document.getElementById("department").value,
        program: document.getElementById("program").value,
        year_level: document.getElementById("year-level").value,
        section: document.getElementById("section").value.trim(),
        status: determineOpenEventStatus(action === "checkin", action === "checkout")
      };

      if (currentEvent.custom_question) {
        record.custom_response = document.getElementById("custom-question-input").value.trim();
      }

      if (action === "checkin") record.check_in_time = new Date().toISOString();
      else if (action === "checkout") record.check_out_time = new Date().toISOString();

      if (!navigator.onLine) {
        const existingQueue = getOfflineQueue();
        const alreadyQueued = existingQueue.some(en => en.eventId === eventId && en.action === action && en.deviceId === deviceId);
        if (alreadyQueued) {
          messageEl.textContent = "⚠️ This device has already submitted attendance for this action (pending sync).";
          messageEl.className = "text-sm text-center mt-3 text-yellow-300 font-medium";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
          return;
        }
        queueOfflineSubmission({ eventId, action, deviceId, record });
        saveReceipt(currentEvent.name, action === "checkin" ? "Check-In" : "Check-Out");
        if (action === "checkin") saveSessionForEvent(eventId, record);
        showOfflineSavedMessage(action);
        return;
      }

      try {
        const { error: lockError } = await supabaseClient
          .from("device_locks")
          .insert({ event_id: eventId, action: action, device_fingerprint: deviceId });

        if (lockError) {
          messageEl.textContent = "⚠️ This device has already submitted attendance for this action.";
          messageEl.className = "text-sm text-center mt-3 text-yellow-300 font-medium";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
          return;
        }

        let error;
        if (action === "checkout") {
          const existing = await findExistingCheckinRecord(eventId, record.first_name, record.last_name);
          if (existing) {
            const updateData = { check_out_time: record.check_out_time, status: determineOpenEventStatus(true, true) };
            if (currentEvent.custom_question) updateData.custom_response = record.custom_response;
            ({ error } = await supabaseClient.from("attendance_records").update(updateData).eq("id", existing.id));
          } else {
            ({ error } = await supabaseClient.from("attendance_records").insert(record));
          }
        } else {
          ({ error } = await supabaseClient.from("attendance_records").insert(record));
        }

        if (error) {
          messageEl.textContent = "❌ " + error.message;
          messageEl.className = "text-sm text-center mt-3 text-yellow-300";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
        } else {
          saveReceipt(currentEvent.name, action === "checkin" ? "Check-In" : "Check-Out");
          if (action === "checkin") saveSessionForEvent(eventId, record);
          formWrapper.innerHTML = `
            <div class="text-center py-6">
              <p class="text-2xl mb-2">✅</p>
              <p class="text-lg font-semibold text-green-700">You're recorded for ${action === "checkin" ? "Check-In" : "Check-Out"}!</p>
              <p class="text-sm text-gray-500 mt-1">${currentEvent.name}</p>
              ${action === "checkin" ? `<p class="text-sm text-yellow-800 font-medium mt-3 bg-yellow-50 border border-yellow-200 rounded-lg p-2">${getCheckinReminderMessage()}</p>` : ''}
            </div>
          `;
        }
      } catch (networkErr) {
        queueOfflineSubmission({ eventId, action, deviceId, record });
        saveReceipt(currentEvent.name, action === "checkin" ? "Check-In" : "Check-Out");
        if (action === "checkin") saveSessionForEvent(eventId, record);
        showOfflineSavedMessage(action);
        return;
      }
    });

    // ---- CLOSED EVENT: name search ----
    document.getElementById("closed-signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("closed-name-input").value;
      const resultsEl = document.getElementById("match-results");
      resultsEl.innerHTML = "";
      messageEl.textContent = "";

      const parsed = parseName(nameInput);
      if (!parsed || !parsed.firstName || !parsed.lastName) {
        messageEl.textContent = "Please enter your full first and last name.";
        messageEl.className = "text-sm text-center mt-3 text-yellow-300";
        return;
      }

      const { data, error } = await supabaseClient
        .from("attendance_records")
        .select("*")
        .eq("event_id", eventId)
        .eq("status", "Absent");

      if (error) {
        messageEl.textContent = "❌ " + error.message;
        messageEl.className = "text-sm text-center mt-3 text-yellow-300";
        return;
      }

      const matches = data.filter(row =>
        namesMatch(parsed, { firstName: row.first_name, lastName: row.last_name })
      );

      if (matches.length === 0) {
        messageEl.textContent = "Name not found on the roster. Please check your spelling or see the event admin.";
        messageEl.className = "text-sm text-center mt-3 text-yellow-300";
      } else if (matches.length === 1) {
        showClosedConfirmCard(matches[0]);
      } else {
        currentMatches = matches;
        messageEl.textContent = "Multiple matches found — please select your name:";
        messageEl.className = "text-sm text-center mt-3 text-white";
        resultsEl.innerHTML = matches.map((m, idx) => `
          <button onclick="selectMatch(${idx})"
            class="block w-full text-left text-sm bg-white border border-gray-300 rounded-lg px-3 py-2 hover:bg-yellow-50">
            ${m.last_name}, ${m.first_name} ${m.middle_name || ''}
          </button>
        `).join('');
      }
    });

    function selectMatch(idx) {
      showClosedConfirmCard(currentMatches[idx]);
    }

    // Shows a "confirm your name" card, with the custom question attached
    // if one is set, before actually signing the student in.
    function showClosedConfirmCard(record) {
      const resultsEl = document.getElementById("match-results");
      const questionHtml = currentEvent.custom_question ? `
        <div class="mt-3 text-left">
          <label class="block text-sm font-medium text-gray-700 mb-1">${currentEvent.custom_question}</label>
          <textarea id="closed-custom-response" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
      ` : '';

      resultsEl.innerHTML = `
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 mt-2 text-left">
          <p class="text-sm font-semibold text-gray-800">Confirm: ${record.last_name}, ${record.first_name} ${record.middle_name || ''}</p>
          ${questionHtml}
          <button id="closed-confirm-btn" class="w-full bg-red-800 hover:bg-red-900 text-white font-semibold py-2 rounded-lg mt-3">
            Confirm & Sign In
          </button>
        </div>
      `;

      document.getElementById("closed-confirm-btn").addEventListener("click", () => {
        const reflectionCheck = validateReflectionField(document.getElementById("closed-custom-response"));
        if (!reflectionCheck.ok) {
          alert(reflectionCheck.reason);
          return;
        }
        verifyAndSignIn(record);
      });
    }

    async function verifyAndSignIn(record) {
      const geoCheck = await verifyGeofence();
      if (!geoCheck.ok) {
        showGeofenceWarning(geoCheck.reason);
        return;
      }

      const scheduleCheck = isWithinScheduleWindow();
      if (!scheduleCheck.ok) {
        showGeofenceWarning(scheduleCheck.reason);
        return;
      }

      const deviceId = getDeviceFingerprint();

      const { error: lockError } = await supabaseClient
        .from("device_locks")
        .insert({ event_id: eventId, action: "signin", device_fingerprint: deviceId });

      if (lockError) {
        messageEl.textContent = "⚠️ This device has already signed someone in for this event.";
        messageEl.className = "text-sm text-center mt-3 text-yellow-300 font-medium";
        return;
      }

      const updateData = { status: "Present", check_in_time: new Date().toISOString() };
      if (currentEvent.custom_question) {
        updateData.custom_response = document.getElementById("closed-custom-response").value.trim();
      }

      const { error } = await supabaseClient
        .from("attendance_records")
        .update(updateData)
        .eq("id", record.id);

      if (error) {
        messageEl.textContent = "❌ " + error.message;
        messageEl.className = "text-sm text-center mt-3 text-yellow-300";
      } else {
        saveReceipt(currentEvent.name, "Sign-In");
        closedFormWrapper.innerHTML = `
          <div class="text-center py-6">
            <p class="text-2xl mb-2">✅</p>
            <p class="text-lg font-semibold text-green-700">Welcome, ${record.first_name}!</p>
            <p class="text-sm text-gray-500 mt-1">You're marked Present for ${currentEvent.name}</p>
          </div>
        `;
      }
    }

    document.getElementById("one-touch-confirm-btn").addEventListener("click", async () => {
      const btn = document.getElementById("one-touch-confirm-btn");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      const geoCheck = await verifyGeofence();
      if (!geoCheck.ok) {
        showGeofenceWarning(geoCheck.reason);
        btn.disabled = false;
        btn.textContent = "Confirm Check-Out";
        return;
      }

      const scheduleCheck = isWithinScheduleWindow();
      if (!scheduleCheck.ok) {
        showGeofenceWarning(scheduleCheck.reason);
        btn.disabled = false;
        btn.textContent = "Confirm Check-Out";
        return;
      }

      const reflectionCheck = validateReflectionField(document.getElementById("one-touch-question-input"));
      if (!reflectionCheck.ok) {
        alert(reflectionCheck.reason);
        btn.disabled = false;
        btn.textContent = "Confirm Check-Out";
        return;
      }

      const deviceId = getDeviceFingerprint();
      const record = {
        event_id: eventId,
        first_name: cachedSession.first_name,
        middle_name: cachedSession.middle_name,
        last_name: cachedSession.last_name,
        department: cachedSession.department,
        program: cachedSession.program,
        year_level: cachedSession.year_level,
        section: cachedSession.section,
        status: determineOpenEventStatus(false, true),
        check_out_time: new Date().toISOString()
      };

      if (currentEvent.custom_question) {
        record.custom_response = document.getElementById("one-touch-question-input").value.trim();
      }

      if (!navigator.onLine) {
        queueOfflineSubmission({ eventId, action: "checkout", deviceId, record });
        saveReceipt(currentEvent.name, "Check-Out");
        showOfflineSavedMessage("checkout", oneTouchWrapper);
        return;
      }

      try {
        const { error: lockError } = await supabaseClient
          .from("device_locks")
          .insert({ event_id: eventId, action: "checkout", device_fingerprint: deviceId });

        if (lockError) {
          messageEl.textContent = "⚠️ This device has already submitted attendance for this action.";
          messageEl.className = "text-sm text-center mt-3 text-yellow-300 font-medium";
          btn.disabled = false;
          btn.textContent = "Confirm Check-Out";
          return;
        }

        const existing = await findExistingCheckinRecord(eventId, record.first_name, record.last_name);
        let error;
        if (existing) {
          const updateData = { check_out_time: record.check_out_time, status: determineOpenEventStatus(true, true) };
          if (currentEvent.custom_question) updateData.custom_response = record.custom_response;
          ({ error } = await supabaseClient.from("attendance_records").update(updateData).eq("id", existing.id));
        } else {
          ({ error } = await supabaseClient.from("attendance_records").insert(record));
        }

        if (error) {
          messageEl.textContent = "❌ " + error.message;
          messageEl.className = "text-sm text-center mt-3 text-yellow-300";
          btn.disabled = false;
          btn.textContent = "Confirm Check-Out";
        } else {
          saveReceipt(currentEvent.name, "Check-Out");
          oneTouchWrapper.innerHTML = `
            <div class="text-center py-6">
              <p class="text-2xl mb-2">✅</p>
              <p class="text-lg font-semibold text-green-700">You're recorded for Check-Out!</p>
              <p class="text-sm text-gray-500 mt-1">${currentEvent.name}</p>
            </div>
          `;
        }
      } catch (networkErr) {
       queueOfflineSubmission({ eventId, action: "checkout", deviceId, record });
        saveReceipt(currentEvent.name, "Check-Out");
        showOfflineSavedMessage("checkout", oneTouchWrapper);
      }
    });

    init();
    updateNetworkBar();
    syncOfflineQueue();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .catch((err) => console.error('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
